# NearbyNudge 2.0 as deployed to Vercel. The app lives in backend/ (its own pyproject.toml is for local use);
# this file only tells Vercel what to install and run:
#   vercel_app.py   the web app (dashboard and API)
#   vercel_jobs.py  the background jobs, run by Vercel Queues
#   backend/scripts/vercel_build.py  builds the dashboard and loads the DC-area listings during the deploy
[project]
name = "nearbynudge-vercel"
version = "2.0.0"
description = "NearbyNudge 2.0 on Vercel: the web app and its background jobs (the code is in backend/)."
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.162",
  "sqlalchemy>=2.1",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "httpx>=0.28",
  "trafilatura>=2.3",
  "extruct>=0.18",
  "protego>=0.7",
  "duckdb>=2.0",
  "python-multipart>=0.0.32",
  "anthropic>=2.3",
  "psycopg[binary]>=3.2",
  "vercel-queue>=0.10",
]

# The versions the test suite ran with (uv.lock pins the rest)
[tool.uv]
constraint-dependencies = [
  "anthropic==2.3.0",
  "anyio==4.15.1",
  "duckdb==2.0.0",
  "extruct==0.18.0",
  "fastapi==0.162.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "httpx2==2.16.0",
  "lxml==6.1.3",
  "protego==0.7.0",
  "psycopg==3.3.6",
  "psycopg-binary==3.3.6",
  "pydantic==2.14.1",
  "pydantic-core==2.50.1",
  "pydantic-settings==2.16.1",
  "python-dotenv==1.2.4",
  "python-multipart==0.0.32",
  "sqlalchemy==2.1.6",
  "starlette==1.10.0",
  "trafilatura==2.3.1",
  "typing-extensions==4.16.0",
  "vercel-queue==0.10.0",
]

[tool.vercel]
entrypoint = "vercel_app:app"

[tool.vercel.scripts]
build = "python backend/scripts/vercel_build.py"

# The dashboard's hashed files (/assets) come from the CDN; pages and the API go through the app.
[tool.vercel.fastapi.static]
cdn = true

[[tool.vercel.subscribers]]
entrypoint = "vercel_jobs"
