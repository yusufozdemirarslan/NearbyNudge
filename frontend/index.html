    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

  <body>
    <!--
    THESIS: NearbyNudge prints a criss-cross city directory for each campaign: every business in range as a white-pages entry, its sources as footnotes, its letter beneath. It refuses the SaaS card dashboard.
    OWN-WORLD: Two inks on white, reversed at night: black and edge red #C8102E. Archivo only: extra-condensed black caps for running heads and thumb tabs, normal width for entries, italic asides. Dot leaders, die-cut tabs, footnotes, square corners, no grey text.
    STORY: The reviewer sees what is ready, opens a business like a directory entry, checks each claim against its footnote, then files it: approve, skip, send.
    FIRST VIEWPORT: Review desk at 1440: masthead (wordmark, nav, Sent today 7 of 20); thumb index cut into the list's edge, Ready in red; white-pages lines; the open entry in 48px condensed caps with a leader to its fit; the letter under a heavy rule; footnotes and a dot-leader site check at right; Approve first.
    FORM: Criss-cross city directory, grounded candidate 5 of 7; seed key 2a8663c5.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <noscript>NearbyNudge needs JavaScript turned on.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
