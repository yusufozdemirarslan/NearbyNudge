<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="application-name" content="NearbyNudge" />
    <meta name="apple-mobile-web-app-title" content="NearbyNudge" />
    <!-- One Step (brand concept 04). The SVG follows the browser's light or dark scheme, like the tab strip it sits on. -->
    <link rel="icon" href="/brand/nearbynudge/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/brand/nearbynudge/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/brand/nearbynudge/apple-touch-icon.png" sizes="180x180" />
    <title>NearbyNudge</title>
    <!-- Applies the saved theme before first paint. External file because the
         Content-Security-Policy forbids inline scripts. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>NearbyNudge needs JavaScript turned on.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
